services:
  # ==========================================
  # INFRAESTRUCTURA BASE
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  ec2-mq:
    image: rabbitmq:3-management
    container_name: ec2-mq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  ec2-kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: ec2-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ec2-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MICROSERVICIOS DE DOMINIO
  # ==========================================
  catalog-svc:
    build: ./MS-VidaSalud-Catalogo
    container_name: catalog-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy

  appointments-svc:
    build: ./MS-VidaSalud-Citas
    container_name: appointments-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
      ec2-mq:
        condition: service_started
      ec2-kafka:
        condition: service_healthy
      

  notify-svc:
    build: ./MS-VidaSalud-Notificaciones
    container_name: notify-svc
    restart: on-failure
    depends_on:
      - ec2-mq

  report-svc:
    build: ./MS-VidaSalud-Reportes
    container_name: report-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
      ec2-kafka:
        condition: service_healthy

  audit-svc:
    build: ./MS-VidaSalud-Auditorias
    container_name: audit-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
      ec2-kafka:
        condition: service_healthy

  # ==========================================
  # BACKEND FOR FRONTEND (Expuesto)
  # ==========================================
  bff-svc:
    build: ./MS-VidaSalud-BFF
    container_name: bff-svc
    restart: on-failure
    depends_on:
      - catalog-svc
      - appointments-svc
      - report-svc
      - audit-svc
    ports:
      - "8080:8080"