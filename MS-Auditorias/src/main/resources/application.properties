spring.application.name=vsAuditorias
server.port=8080

spring.datasource.url=jdbc:mysql://mysql-db:3306/audit_db
spring.datasource.username=audit_user
spring.datasource.password=audit_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=ec2-kafka:9092
spring.kafka.consumer.group-id=audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Evita que el microservicio colapse si el tópico de Kafka no existe al iniciar
spring.kafka.listener.missing-topics-fatal=false